name: calorie_scanner
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.4.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.0

  # Image picker
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # App Icon generator
  flutter_launcher_icons: ^0.13.1

# ====== CONFIG: flutter_launcher_icons ======
flutter_launcher_icons:
  android: true
  ios: true

  # ใช้รูปเดียวเป็นหลัก (ต้องเป็น PNG)
  image_path: "assets/icon/icon3.png"

  # ทำให้ Android adaptive icon ดูเต็มขึ้น (พื้นหลัง + foreground)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon3.png"

  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon3.png
